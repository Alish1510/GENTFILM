<section class="contact-section">
  <p class="contact-intro">Un projet, une envie, une question&nbsp;? Écrivez, GENTFILM vous répond avec plaisir.</p>

  <form class="contact-form" id="contactForm">
    <input type="text" name="nom" placeholder="Votre nom" required>
    <input type="email" name="email" placeholder="Votre email" required>
    <textarea name="message" placeholder="Votre message" rows="5" required></textarea>
    <button type="submit" class="contact-submit">Envoyer</button>
  </form>

  <div class="contact-direct">
    <a href="mailto:contact@gentfilm.com" class="contact-link">contact@gentfilm.com</a>
    <a href="https://instagram.com" target="_blank" class="contact-link">@gentfilm</a>
    <a href="https://wa.me/41791234567" target="_blank" class="contact-link">WhatsApp — +41 79 123 45 67</a>
  </div>
