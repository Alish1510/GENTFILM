<section class="page-title">
  <h1>Contact</h1>
  <p class="page-subtitle">Un projet, une envie, une question&nbsp;? Écrivez, GENTFILM vous répond avec plaisir.</p>
</section>

<section class="contact-section">

  <form class="contact-form" id="contactForm">
    <input type="text" name="nom" placeholder="Votre nom" required>
    <input type="email" name="email" placeholder="Votre email" required>
    <textarea name="message" placeholder="Votre message" rows="5" required></textarea>
    <button type="submit" class="contact-submit">Envoyer</button>
  </form>

  <div class="contact-direct">

    <a href="mailto:contact@gentfilm.com" class="contact-row">
      <span class="contact-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2 6l10 7 10-7"/></svg>
      </span>
      <span class="contact-text">contact@gentfilm.com</span>
    </a>

    <a href="https://instagram.com/gentfilm" target="_blank" class="contact-row">
      <span class="contact-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4.5"/><circle cx="17.2" cy="6.8" r="1"/></svg>
      </span>
      <span class="contact-text">@gentfilm</span>
    </a>

    <a href="https://wa.me/41791234567" target="_blank" class="contact-row">
      <span class="contact-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20 12a8 8 0 1 1-3.8-6.8L20 4l-1.1 3.7A7.9 7.9 0 0 1 20 12Z"/><path d="M8.5 9.5c.3 2.5 2.5 4.7 5 5 .6.1 1-.4.9-1l-.2-.9c-.1-.4-.5-.6-.9-.5l-1 .3c-.6-.4-1.2-1-1.6-1.6l.3-1c.1-.4-.1-.8-.5-.9l-.9-.2c-.6-.1-1.1.3-1.1.8Z"/></svg>
      </span>
      <span class="contact-text">+41 79 123 45 67</span>
    </a>

  </div>
</section>

</html>
