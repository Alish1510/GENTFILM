<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GENTFILM — Contact</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <a href="accueil.html" class="site-logo">GENTFILM</a>
  <button class="burger" id="burgerBtn" aria-label="Ouvrir le menu">
    <span></span><span></span><span></span>
  </button>
</header>

<nav class="fullscreen-nav" id="fullscreenNav">
  <a href="accueil.html" class="nav-link">Accueil</a>
  <a href="photo.html" class="nav-link">Photo</a>
  <a href="video.html" class="nav-link">Vidéo</a>
  <a href="contact.html" class="nav-link">Contact</a>
</nav>

<section class="page-title">
  <h1>Contact</h1>
  <p class="page-subtitle">Un projet, une envie, une question&nbsp;? Écrivez, GENTFILM vous répond avec plaisir.</p>
</section>

<section class="contact-section">

  <form class="contact-form" id="contactForm">
    <input type="text" name="nom" placeholder="Votre nom" required>
    <input type="email" name="email" placeholder="Votre email" required>
    <textarea name="message" placeholder="Votre message" rows="5" required></textarea>
    <button type="submit" class="contact-submit">Envoyer</button>
  </form>

  <div class="contact-direct" aria-label="Moyens de contacter GENTFILM">

    <a
      href="https://www.instagram.com/gentfilm_/"
      target="_blank"
      rel="noopener noreferrer"
      class="contact-row"
      aria-label="Ouvrir le profil Instagram de GENTFILM"
      title="Instagram"
    >
      <span class="contact-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.35" aria-hidden="true">
          <rect x="2" y="2" width="20" height="20" rx="5"></rect>
          <circle cx="12" cy="12" r="4.5"></circle>
          <circle cx="17.2" cy="6.8" r="1"></circle>
        </svg>
      </span>
      <span class="sr-only">Instagram</span>
    </a>

    <a
      href="mailto:gentfilm.visual@gmail.com?subject=Projet%20GENTFILM"
      class="contact-row"
      aria-label="Envoyer un e-mail à GENTFILM"
      title="Envoyer un e-mail"
    >
      <span class="contact-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.35" aria-hidden="true">
          <rect x="2" y="4" width="20" height="16" rx="2"></rect>
          <path d="M2 6l10 7 10-7"></path>
        </svg>
      </span>
      <span class="sr-only">E-mail</span>
    </a>

    <a
      href="https://wa.me/41792021617?text=Bonjour%20GENTFILM%2C%20j%27aimerais%20vous%20parler%20d%27un%20projet."
      target="_blank"
      rel="noopener noreferrer"
      class="contact-row"
      aria-label="Ouvrir une discussion WhatsApp avec GENTFILM"
      title="WhatsApp"
    >
      <span class="contact-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.35" aria-hidden="true">
          <path d="M20 12a8 8 0 1 1-3.8-6.8L20 4l-1.1 3.7A7.9 7.9 0 0 1 20 12Z"></path>
          <path d="M8.5 9.5c.3 2.5 2.5 4.7 5 5 .6.1 1-.4.9-1l-.2-.9c-.1-.4-.5-.6-.9-.5l-1 .3c-.6-.4-1.2-1-1.6-1.6l.3-1c.1-.4-.1-.8-.5-.9l-.9-.2c-.6-.1-1.1.3-1.1.8Z"></path>
        </svg>
      </span>
      <span class="sr-only">WhatsApp</span>
    </a>

  </div>
</section>

<script src="script.js"></script>
</body>
</html>
